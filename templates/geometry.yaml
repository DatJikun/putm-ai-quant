  # te pola są zapasem dla case'ów bez ustawień kół.
  frontAxleXMm: 0
  rearAxleXMm: 1530
  groundZMm: 0
  trackMm: TBD
  frontalAreaM2: 0.5
  frontalAreaBasis: half
  origin: "X rośnie do tyłu; post-pro X od -1.1 do 2.5 m. Oś przednia X=0, tylna X=1530 mm (oś obrotu kół w solverze)."
